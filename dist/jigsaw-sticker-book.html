<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジグソー">
<meta name="theme-color" content="#7a4b16">
<title>ジグソーシール帳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
canvas,img{display:block;-webkit-user-drag:none}

/* 左上の「ギャラリーへもどる」ボタン */
.home{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:50;width:44px;height:44px;
  border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;
  text-decoration:none;color:#444;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* ごほうび */
.confetti-piece{position:fixed;top:-24px;width:12px;height:18px;z-index:200;pointer-events:none;
  animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}
.banner{position:fixed;left:0;right:0;bottom:24%;z-index:210;text-align:center;pointer-events:none;white-space:nowrap;
  font-size:min(12.5vw,76px);font-weight:900;color:#fff;letter-spacing:.04em;
  text-shadow:0 4px 0 #ff7a59,0 8px 14px rgba(0,0,0,.3);animation:ban 2.2s ease forwards}
@keyframes ban{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.15) rotate(3deg);opacity:1}
  25%{transform:scale(1) rotate(0)}85%{opacity:1}100%{transform:scale(1);opacity:0}}

/* 保護者ゲート */
.gate-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:grid;place-items:center}
.gate{background:#fff;border-radius:22px;padding:22px 20px 14px;width:min(88vw,340px);text-align:center;color:#333}
.gate h2{margin:0 0 4px;font-size:18px}
.gate p{margin:0 0 10px;color:#666;font-size:13px}
.gate .q{font-size:34px;font-weight:800;margin:6px 0 14px}
.gate .ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate .ans button{padding:14px;font-size:26px;border-radius:14px;border:2px solid #ddd;background:#f6f6f6}
.gate .ans button:active{background:#e8f0ff}
.gate .cancel{margin-top:10px;background:none;border:0;color:#888;font-size:14px;padding:8px 14px}

/* ドラッグ中のピース */
.drag{filter:drop-shadow(0 10px 10px rgba(0,0,0,.35)) !important;cursor:grabbing}

</style>
<style>
/* 木の机・紙のカード。02「ほんもの風ジグソー」の世界観をアプリ全体に広げる */
:root{
  --wood1:#d9a566; --wood2:#c58f4f; --wood-dark:#7a4b16; --wood-deep:#5f3a10;
  --paper:#fff6e0; --paper2:#fffaf0; --ink:#4a2f10; --muted:#8a6a3c; --line:#ecd9b0;
  --accent:#ff8a3c; --go:#3ec598; --gold:#e8a100;
}
body{background:var(--wood2);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font-family:inherit;color:inherit}
.wood{background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 3px,transparent 3px 11px),linear-gradient(var(--wood1),var(--wood2))}

/* ============================== ホーム ============================== */
#home{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 3px,transparent 3px 11px),linear-gradient(var(--wood1),var(--wood2))}
.hwrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.hhead{display:flex;align-items:center;gap:10px}
.hhead h1{flex:1;margin:0;font-size:21px;white-space:nowrap;line-height:1.2;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--wood-dark),0 4px 10px rgba(0,0,0,.25)}
.bookbtn{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:8px;border:0;border-radius:18px;background:var(--paper);padding:8px 12px;box-shadow:0 4px 0 var(--wood-dark);text-align:left}
.bookbtn .bk{grid-row:1/3;width:30px;height:38px;border-radius:5px 9px 9px 5px;background:var(--cover,#ffb74d);box-shadow:inset 6px 0 0 rgba(0,0,0,.18),inset -2px 0 0 rgba(255,255,255,.4)}
.bookbtn b{font-size:14px;line-height:1.1}
.bookbtn small{font-size:12px;color:var(--muted)}
.gear{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:22px;box-shadow:0 3px 0 var(--wood-dark)}
.hwrap h2{margin:8px 0 0;font-size:16px;color:#fff;text-shadow:0 1px 0 var(--wood-dark);letter-spacing:.04em}
.resume{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:18px;padding:12px 16px;background:var(--go);color:#fff;box-shadow:0 4px 0 #249a74;text-align:left}
.resume b{font-size:18px}.resume span{font-size:13px;opacity:.95}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{aspect-ratio:1;border:4px solid transparent;border-radius:14px;background:#fff;padding:0;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.th img{width:100%;height:100%;object-fit:cover}
.th.wide{grid-column:span 2;aspect-ratio:2/1}
.th.on{border-color:var(--accent);box-shadow:0 0 0 3px #fff,0 3px 0 rgba(0,0,0,.2)}
.th.add{background:rgba(255,255,255,.35);border:3px dashed #fff;display:grid;place-content:center;color:#fff;text-shadow:0 1px 0 var(--wood-dark)}
.th.add span{font-size:30px;line-height:1}.th.add small{font-size:12px;font-weight:700}
.cnts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cn{border:0;border-radius:14px;background:var(--paper);padding:8px 4px;box-shadow:0 3px 0 var(--wood-dark);display:flex;flex-direction:column;align-items:center}
.cn b{font-size:24px;line-height:1.1}.cn small{font-size:11px;color:var(--muted)}
.cn.on{background:var(--accent);color:#fff;box-shadow:0 3px 0 #c9631a}.cn.on small{color:#ffe9d6}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{border:0;border-radius:14px;background:var(--paper);padding:10px 12px;box-shadow:0 3px 0 var(--wood-dark);text-align:left;display:grid;gap:1px}
.lv b{font-size:15px}.lv .st{color:var(--gold);font-size:13px;letter-spacing:1px}.lv small{font-size:11.5px;color:var(--muted);line-height:1.35}
.lv.on{background:var(--accent);color:#fff;box-shadow:0 3px 0 #c9631a}.lv.on .st{color:#fff3b0}.lv.on small{color:#ffe9d6}
.start{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;margin-top:6px;height:68px;border:0;border-radius:20px;background:var(--go);color:#fff;font-size:26px;font-weight:900;box-shadow:0 6px 0 #249a74}
.start:active{transform:translateY(3px);box-shadow:0 3px 0 #249a74}
.hfoot{text-align:center;margin-top:6px}.hfoot a{color:#fff;font-size:13px;opacity:.85}

/* ============================== ゲーム ============================== */
#game.on{display:grid;grid-template-columns:100%;grid-template-rows:52px minmax(0,1fr) auto;grid-template-areas:"bar" "view" "tray"}
#bar{grid-area:bar;display:flex;align-items:center;gap:5px;padding:0 8px;padding-top:env(safe-area-inset-top);background:var(--wood-dark);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:5}
#bar button{height:40px;min-width:40px;border:0;border-radius:20px;background:#fff6e0;color:var(--wood-dark);font-size:20px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.3);padding:0 10px}
#bar button{flex:none;white-space:nowrap}
#bar button.wide{font-size:15px;padding:0 12px;background:var(--accent);color:#fff}
#bar .sp{flex:1}
#timer{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
#left{font-size:13px;opacity:.9;white-space:nowrap;min-width:0}
#view{grid-area:view;position:relative;overflow:hidden;touch-action:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 3px,transparent 3px 11px),linear-gradient(var(--wood1),var(--wood2))}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;--inv:1}
#table{position:absolute;z-index:0;pointer-events:none;border:calc(3px*var(--inv)) dashed rgba(255,255,255,.5);border-radius:calc(18px*var(--inv));background:rgba(70,40,10,.10)}
#board{position:relative;z-index:1;display:block;border-radius:2px;box-shadow:0 calc(8px*var(--inv)) calc(26px*var(--inv)) rgba(0,0,0,.5)}
.final{position:absolute;left:0;top:0;z-index:2;opacity:0;transition:opacity 1.1s ease;pointer-events:none;border-radius:2px}
.final.on{opacity:1}
.pop{position:absolute;pointer-events:none;z-index:100000;animation:popin .5s ease-out forwards;filter:drop-shadow(0 0 calc(10px*var(--inv)) #fff5b0)}
@keyframes popin{0%{transform:scale(1.5);opacity:.2}55%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:0}}
#ring{position:absolute;display:none;pointer-events:none;border:calc(5px*var(--inv)) solid #ffe14d;border-radius:calc(8px*var(--inv));box-shadow:0 0 calc(14px*var(--inv)) #fff,inset 0 0 calc(10px*var(--inv)) #fff;z-index:99999}
#ring.on{display:block;animation:ringp .55s ease-in-out infinite alternate}
@keyframes ringp{to{transform:scale(1.12);opacity:.6}}

/* 右上の見本 */
#ref{position:absolute;top:8px;right:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
#ref .pic{border:3px solid #fff;border-radius:8px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);overflow:hidden}
#ref img{display:block;width:100%;height:100%;object-fit:fill}
#ref .zm{font-size:11px;font-weight:800;color:#fff;background:rgba(40,25,10,.78);border-radius:10px;padding:1px 9px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)}
#peek{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(30,18,6,.85)}
#peek.on{display:grid}
#peek img{max-width:94%;max-height:94%;border:6px solid #fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}

/* いま持っているピース */
#hand{position:absolute;left:10px;top:8px;width:112px;height:112px;z-index:6;display:none;place-items:center;background:rgba(255,246,224,.94);border:3px solid var(--accent);border-radius:20px;box-shadow:0 5px 14px rgba(0,0,0,.4)}
#hand.on{display:grid}
#hand canvas{width:100%;height:100%;object-fit:contain;transition:transform .2s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
#hand.rot:after{content:"↻";position:absolute;right:-8px;top:-10px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;font-weight:900}
#hand.wob{animation:wob .4s}
@keyframes wob{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;white-space:normal;text-align:center;line-height:1.5;z-index:8;background:rgba(40,25,10,.88);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ピース置き場 */
#trayWrap{grid-area:tray;background:var(--wood-dark);border-top:3px solid var(--wood-deep);display:flex;flex-direction:column;min-width:0;padding-bottom:env(safe-area-inset-bottom)}
#filters{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 2px}
#filters button{white-space:nowrap;height:30px;border:0;border-radius:15px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:800;padding:0 12px}
#filters button.on{background:#fff6e0;color:var(--wood-dark)}
#tray{position:relative;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,93px);gap:2px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding:4px 8px 8px;height:204px;-webkit-overflow-scrolling:touch}
.tp{display:grid;place-items:center;border-radius:16px;touch-action:pan-x;transition:background .15s}
.tp canvas{display:block;pointer-events:none;transition:transform .2s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.tp.hide{display:none}
.tp.sel{background:rgba(255,225,77,.55);box-shadow:0 0 0 3px #ffe14d inset;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}

/* 横向き：ピース置き場は右 */
@media (orientation:landscape){
  #game.on{grid-template-columns:minmax(0,1fr) 214px;grid-template-rows:48px minmax(0,1fr);grid-template-areas:"bar bar" "view tray"}
  #trayWrap{border-top:0;border-left:3px solid var(--wood-deep);min-height:0}
  #tray{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(2,93px);overflow-x:hidden;overflow-y:auto;touch-action:pan-y;height:auto;flex:1;align-content:start}
  .tp{touch-action:pan-y}
  #hand{width:92px;height:92px}
  #filters{gap:4px;padding:6px 6px 2px}
  #filters button{padding:0 9px;font-size:12px}
}

/* ============================== 読み込み・通知 ============================== */
#loading{position:fixed;inset:0;z-index:400;display:none;place-content:center;justify-items:center;gap:14px;background:rgba(40,25,10,.78);color:#fff;font-weight:800}
#loading.on{display:grid}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#flash{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:420;max-width:92vw;text-align:center;line-height:1.5;background:#fff6e0;color:var(--ink);padding:10px 18px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:all .25s;font-weight:800;font-size:14px}
#flash.on{opacity:1;transform:translate(-50%,0)}

/* ============================== シート（クリア・設定） ============================== */
#sheet{position:fixed;inset:0;z-index:250;display:none;place-items:center;background:rgba(30,18,6,.6);padding:16px}
#sheet.on{display:grid}
.box{background:var(--paper);border-radius:24px;padding:20px;width:min(94vw,420px);max-height:92vh;overflow-y:auto;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.box h2{margin:0 0 6px;font-size:21px;text-align:center}
.box h3{margin:16px 0 6px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:52px;border:0;border-radius:16px;background:#fff;color:var(--ink);font-size:15px;font-weight:900;box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.go{background:var(--go);color:#fff;border-color:var(--go);box-shadow:0 3px 0 #249a74}
.clear{text-align:center}
.meta{margin:6px 0 0;font-size:16px;font-weight:800}.meta.sub{font-size:13px;color:var(--muted);font-weight:600;line-height:1.6}
.gold{color:var(--gold)}
.grow{margin:12px 0 0;padding:10px;border-radius:14px;background:linear-gradient(110deg,#fff3b0,#ffd0e6);font-size:14px;font-weight:800;line-height:1.5}
.grow b{font-size:17px}
.seg{display:flex;gap:8px}.seg button{flex:1;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pi{width:84px;text-align:center}.pi img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.pi .del,.dng{margin-top:4px;border:0;border-radius:10px;background:#ffe3e3;color:#c92a2a;font-weight:800;font-size:12px;padding:6px 4px;width:100%}
.dng{display:block;font-size:14px;padding:12px;margin:6px 0}
.armed{background:#c92a2a !important;color:#fff !important}
.note{font-size:12.5px;color:var(--muted);line-height:1.7}

/* ============================== シール ============================== */
.stk{position:relative;width:100%;aspect-ratio:1;max-width:150px;margin:0 auto;transform:rotate(var(--r,0deg))}
.stk.big{max-width:210px;margin:12px auto 4px;animation:stick .8s cubic-bezier(.3,1.6,.5,1)}
.stk .ring{width:100%;height:100%;border-radius:50%;padding:6px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.stk img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.stk.f1 .ring{background:linear-gradient(135deg,#f5f7fa,#aab4c2,#f5f7fa)}
.stk.f2 .ring{background:linear-gradient(135deg,#fff1a8,#e8a100,#fff1a8);box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 12px rgba(255,200,40,.6)}
.stk.f3 .ring{background:conic-gradient(#ff5a5f,#ffc61a,#3ec598,#3b8bff,#a56bff,#ff5a5f);box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.8)}
.stk .cap{position:absolute;right:-4px;bottom:-2px;background:#fff;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.3);color:var(--ink)}
.stk .cap small{color:var(--gold);margin-left:3px;font-size:10px}
@keyframes stick{from{transform:scale(2.4) rotate(25deg);opacity:0}}

/* ============================== シール帳 ============================== */
#book{--page:#fff6e0;--cover:#ffb74d;background:var(--cover);padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));flex-direction:column}
#book.on{display:flex}
.bkhead{display:flex;align-items:center;gap:10px;padding:2px 2px 10px}
.rb{width:46px;height:46px;border:0;border-radius:50%;background:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bkt{flex:1;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);display:grid;gap:1px}.bkt b{font-size:18px}.bkt small{font-size:12px}
.bkt .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:3px}.bkt .bar i{display:block;height:100%;background:#fff;border-radius:4px}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;background:var(--page);border-radius:20px;box-shadow:inset 8px 0 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.3)}
.pg{flex:0 0 100%;scroll-snap-align:center;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:16px 16px 12px 22px;min-width:0}
@media (orientation:landscape){.pg{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}}
.slot{min-height:0;border:0;background:none;padding:6px;display:grid;place-items:center}
.slot.empty{border:3px dashed rgba(120,90,40,.28);border-radius:20px;margin:4px}
.slot.empty.next{border-color:var(--accent);animation:nx 1.2s ease-in-out infinite alternate}
.slot.empty span{font-size:34px;font-weight:900;color:var(--accent)}
@keyframes nx{to{background:rgba(255,138,60,.14)}}
.dots{display:flex;justify-content:center;gap:6px;padding-top:8px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}.dots i.on{background:#fff;transform:scale(1.25)}
#book.night .slot.empty{border-color:rgba(255,255,255,.3)}
#book.night .pages{background:radial-gradient(circle at 20% 20%,#3a3f9a,#232766 60%)}

/* 小さいスマホ（幅360px前後）でもバーが収まるように */
@media (max-width:380px){
  #bar{gap:4px;padding:0 6px}
  #bar button{height:36px;min-width:36px;padding:0 6px;font-size:18px}
  #bar button.wide{font-size:14px;padding:0 10px}
  #timer{font-size:16px;min-width:2.8em}
  #left{font-size:12px}
}

/* テーブルに置いたピース／かたまり */
.grp{position:absolute;pointer-events:none;filter:drop-shadow(0 calc(3px*var(--inv)) calc(5px*var(--inv)) rgba(0,0,0,.5))}
.grp.sel{filter:drop-shadow(0 0 calc(5px*var(--inv)) #ffe14d) drop-shadow(0 0 calc(2px*var(--inv)) #ffe14d)}
.grp.joined{animation:joined .45s ease-out}
@keyframes joined{0%{transform:scale(1.06)}100%{transform:scale(1)}}

/* あそびかた・もどす */
#filters .help{margin-left:auto;background:#fff6e0;color:var(--wood-dark)}
#back2tray{position:absolute;left:10px;top:128px;z-index:6;display:none;border:0;border-radius:16px;padding:7px 12px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;box-shadow:0 3px 0 #c9631a}
#back2tray.on{display:block}
@media (orientation:landscape){#back2tray{top:108px}}
.helpbtn{border:0;border-radius:20px;background:rgba(255,255,255,.88);color:var(--wood-dark);font-weight:800;font-size:14px;padding:10px 16px;box-shadow:0 3px 0 var(--wood-dark)}
.helpbox{width:min(94vw,460px)}
.helpbox h2{margin-bottom:10px}
.hrow{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow svg{width:58px;height:58px;background:#fff;border-radius:14px;border:2px solid var(--line)}
.hrow b{display:block;font-size:15px;margin-bottom:2px}
.hrow p{margin:0;font-size:13px;line-height:1.65;color:#5a4220}

/* 写真のサムネイル：パズルと同じ縦横比 */
.th.photo{display:grid;place-items:center;background:#fff}
.th.photo img{object-fit:fill;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

/* えをえらぶ：見出し（のりもの／どうぶつ・しぜん／しゃしん） */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.55);color:var(--wood-dark);font-size:14px;font-weight:800;white-space:nowrap;padding:0 4px}
.tabs button.on{background:var(--paper);box-shadow:0 3px 0 var(--wood-dark)}
.picked{margin:0;color:#fff;font-size:13px;text-shadow:0 1px 0 var(--wood-dark)}
.picked b{font-size:15px}

/* しゃしんを えらぶ（ゲートのあとに出す、本物のファイル選択ボタン） */
.filebtn{position:relative;display:grid;place-items:center;height:76px;margin-top:14px;border-radius:20px;background:var(--go);color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px 0 #249a74;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:60px}

.logbox{max-height:160px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px;touch-action:pan-y}
.logbox p{margin:3px 0;font-size:11px;line-height:1.5;word-break:break-all;color:#5a4220}

.brokenph{display:grid;place-items:center;width:100%;height:100%;min-height:60px;padding:4px;text-align:center;font-size:11px;font-weight:800;line-height:1.3;color:#c92a2a;background:#ffe3e3;border-radius:8px}
.th.photo .brokenph{aspect-ratio:1}

.warn{background:#fff3cd;color:#5a4220;border:2px solid #e8a100;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.6}

/* 写真の きりとり */
.cropbox{width:min(94vw,420px)}
.cropstage{margin:6px auto 8px;width:max-content;max-width:100%;border-radius:12px;overflow:hidden;background:#222;touch-action:none}
.cropstage canvas{display:block}
.aspects{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.aspects button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;color:var(--ink)}
.aspects button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.zoomrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.zoomrow input{flex:1;height:32px}
.mini{border:0;border-radius:12px;background:var(--paper);color:var(--wood-dark);font-size:12px;font-weight:800;padding:4px 10px;margin-left:6px;box-shadow:0 2px 0 var(--wood-dark)}

/* つぎは これ */
.recbox{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;padding:10px 14px;border:3px solid #ffd45c;border-radius:18px;background:linear-gradient(#fffbe6,#fff0b8);color:var(--ink);text-align:left;box-shadow:0 4px 0 #e0b43a}
.recbox img{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:cover;flex:none}
.recbox .star{font-size:34px;color:#f5a400;width:52px;text-align:center;flex:none}
.recbox b{display:block;font-size:17px}
.recbox small{display:block;font-size:12px;color:var(--muted)}
.recbox .why{color:#8a6a1a;margin-top:2px}
.cn.rec,.lv.rec{position:relative}
.cn.rec::after,.lv.rec::after{content:'おすすめ';position:absolute;top:-9px;right:-4px;background:#f5a400;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;box-shadow:0 1px 0 #b57800}

/* ずかん */
.zkbtn{width:56px;height:46px;border-radius:16px;border:0;background:var(--paper);box-shadow:0 3px 0 var(--wood-dark);font-size:12px;padding:0;color:var(--ink)}
.zkbtn b{font-size:12px}
.hhead{gap:6px}
.zukanbox{width:min(94vw,440px);max-height:90vh;overflow:auto}
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zk{border:2px solid var(--line);border-radius:14px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.zk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;filter:brightness(0) opacity(.18)}
.zk.got img{filter:none}
.zk span{font-size:10px;font-weight:800;line-height:1.2;text-align:center;min-height:24px;display:flex;align-items:center}
.zk.got{border-color:#ffd45c;background:#fffbe6}
.zbig img{width:200px;max-width:70vw;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.zbig{text-align:center}
.fact{font-size:16px;line-height:1.7;text-align:center;margin:8px 0 12px}
.zk .qq{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:10px;background:#e9dfc8;color:#c8b896;font-style:normal;font-size:28px;font-weight:900}
.zk span{font-size:9.5px;letter-spacing:-.02em}
.hhead h1{font-size:17px}
.bookbtn{padding:6px 9px;column-gap:6px}.bookbtn b,.bookbtn small{white-space:nowrap}.bookbtn small{font-size:11px}
.bookbtn .bk{width:24px;height:32px}

/* あそんだ記録・きゅうけい */
.rest{font-size:54px;text-align:center}
.rep .bars{display:flex;gap:6px;align-items:flex-end;height:96px;padding:4px 0 0}
.rep .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.rep .b i{display:block;width:100%;min-height:2px;background:linear-gradient(#ffb066,#ff8a3c);border-radius:6px 6px 0 0}
.rep .b small{font-size:10px;color:var(--muted);position:absolute;top:-2px}
.rep .b span{font-size:11px;font-weight:800;margin-top:2px}
#sBreak button{white-space:nowrap;padding-left:2px;padding-right:2px;font-size:13px}

/* プロフィール */
.toprow{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.toprow .helpbtn{flex:1;margin:0}
.whobtn{display:flex;align-items:center;gap:6px;border:0;border-radius:18px;background:var(--paper);padding:6px 12px;box-shadow:0 3px 0 var(--wood-dark);color:var(--ink);max-width:55%}
.whobtn .av{font-size:22px}.whobtn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.whobtn i{font-style:normal;font-size:10px;color:var(--muted)}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.who button{display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:16px;background:#fff;padding:10px;color:var(--ink);font-size:16px}
.who button.on{border-color:var(--accent);background:#fff2e4}.who .av{font-size:30px}
.prow{display:flex;gap:6px;align-items:center;margin:6px 0}
.prow .pav{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;flex:none}
.prow input{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font-size:16px;background:#fff;color:var(--ink)}
.prow .pdel{flex:none;width:auto;padding:0 12px;height:44px;margin:0}
.prow .pdel:disabled{opacity:.35}

/* えを かく */
.drawbox{width:min(94vw,420px);max-height:94vh;overflow:auto}
.drawstage{margin:4px auto 8px;width:max-content;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px var(--line);background:#fff}
.drawstage canvas{display:block;touch-action:none;cursor:crosshair}
.dcolors{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.dcolors button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.dcolors button.on{box-shadow:0 0 0 4px var(--accent)}
.dcolors .era{background:#fff;font-size:18px;line-height:1}
.dtools{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.dtools .lbl{font-size:11px;color:var(--muted);margin-left:6px}
.dtools button[data-w]{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.dtools button[data-w] i{display:block;border-radius:50%;background:#444}
.dtools button.on{border-color:var(--accent);background:#fff2e4}
#drBg{display:inline-flex;gap:4px}
#drBg button{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);padding:0}
#drBg button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* ふちガイド */
.edgeguide{position:absolute;left:0;top:0;z-index:2;pointer-events:none;box-sizing:border-box;outline:calc(6px*var(--inv)) solid rgba(255,138,60,.9);transition:opacity .6s}
.edgeguide.gone{opacity:0}

.bkin{display:block;text-align:center;margin-top:8px}
.bkin{height:52px;font-size:16px;box-shadow:0 4px 0 #249a74}

.policy{font-size:14px;line-height:1.7}.policy ul{padding-left:1.2em;margin:6px 0}.policy li{margin:6px 0}

/* つづきを けす */
.resumewrap{position:relative}
.resumewrap .resume{padding-right:56px}
.resdel{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#c0392b;font-size:18px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.go.dangerbtn{background:#e5534b;border-color:#e5534b;box-shadow:0 3px 0 #b3362f}

</style>

<script>
/* うまく動かなかったときに、画面に理由を出す（スクリーンショットで教えてもらうため） */
(function () {
  function show(m) {
    var d = document.getElementById('fatal');
    if (!d) { d = document.createElement('div'); d.id = 'fatal'; d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#fff3cd;color:#5a4220;border:2px solid #e8a100;border-radius:12px;padding:10px 12px;font:13px/1.5 sans-serif;white-space:pre-wrap;word-break:break-all'; document.body.appendChild(d); }
    d.textContent = 'うまく うごきませんでした。この がめんを おしえてください：\n' + m;
  }
  addEventListener('error', function (e) { show((e.message || 'error') + '  [' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ']'); });
  addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Promise: ' + ((r && (r.name + ': ' + r.message)) || r)); });
})();
</script>

  <section id="home" class="scr on"></section>

  <!-- ゲーム：上=ボタン / 中=盤面（拡大・移動できる） / 下=ピース置き場 -->

      <button id="zIn" aria-label="おおきく">＋</button>

    <div id="view">
      <div id="world"><div id="table"></div><canvas id="board"></canvas><div id="ring"></div></div>

      <div id="hand" aria-label="いま えらんでいるピース"></div>
      <button id="back2tray" type="button">おきばへ もどす</button>
      <div id="peek"><img alt="みほん（おおきく）"></div>
      <div id="toast"></div>
    </div>
    <aside id="trayWrap">
      <div id="filters"><button data-f="all">ぜんぶ</button><button data-f="edge">ふち</button><button data-f="mid">なか</button><button id="gHelp" class="help" type="button">？ あそびかた</button></div>
      <div id="tray"></div>
    </aside>
  </section>

  <!-- シール帳 -->
  <section id="book" class="scr"></section>

  <div id="sheet"></div>
  <div id="loading"><div class="spin"></div><span></span></div>
  <div id="flash"></div>
</main>

    const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);

    for (let i = 0; i < rows; i++) { h.push([]); v.push([]); for (let j = 0; j < cols; j++) { h[i].push(r() < .5 ? 1 : -1); v[i].push(r() < .5 ? 1 : -1); } }

    const P = (t, hh) => [ax + ux * L * t + nx * L * hh * s * K, ay + uy * L * t + ny * L * hh * s * K];

    const top = r > 0 ? -E.h[r - 1][c] : 0, bottom = r < rows - 1 ? E.h[r][c] : 0;
    const left = c > 0 ? -E.v[r][c - 1] : 0, right = c < cols - 1 ? E.v[r][c] : 0;
    p.moveTo(0, 0);
    side(p, 0, 0, w, 0, 0, -1, top);

      clearTimeout(t);
      t = setTimeout(() => {
        const flip = (innerWidth >= innerHeight) !== (lw >= lh), big = Math.abs(innerWidth - lw) / lw > .15;
        if (flip || big) { lw = innerWidth; lh = innerHeight; fn(); }
      }, 250);
    });
  };

  /* -------------------------------------------- ドラッグ（ポインタ共通） */
  PZ.drag = (el, h) => {
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', (e) => {
      if (h.canStart && !h.canStart(el, e)) return;
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) { }
      const sx = e.clientX, sy = e.clientY;
      h.start && h.start(el, e);
      const mv = (ev) => h.move && h.move(el, ev.clientX - sx, ev.clientY - sy, ev);
      const up = (ev) => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        h.end && h.end(el, ev.clientX - sx, ev.clientY - sy, ev);
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  };

  /* n個のピース(幅pw,高さph)を area 内に「ゆらぎつきグリッド」で散らす。重なりを最小にする */
  PZ.scatter = (n, area, pw, ph) => {
    const W = Math.max(1, area.x1 - area.x0), H = Math.max(1, area.y1 - area.y0);
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), score = Math.min(W / cols / pw, H / rows / ph);
      if (!best || score > best.score) best = {cols, rows, score};
    }
    const cw = W / best.cols, rh = H / best.rows;
    return PZ.shuffle([...Array(best.cols * best.rows).keys()]).slice(0, n).map((k) => {
      const c = k % best.cols, r = Math.floor(k / best.cols);
      const jx = (Math.random() - .5) * Math.min(24, Math.abs(cw - pw) * .8), jy = (Math.random() - .5) * Math.min(24, Math.abs(rh - ph) * .8);
      const x = area.x0 + c * cw + (cw - pw) / 2 + jx, y = area.y0 + r * rh + (rh - ph) / 2 + jy;
      return {x: Math.min(Math.max(x, area.x0), Math.max(area.x0, area.x1 - pw)), y: Math.min(Math.max(y, area.y0), Math.max(area.y0, area.y1 - ph))};
    });
  };

  /* ----------------------------- 「ドラッグして、近づくと吸い付く」共通部品
     pieces: [{el, tx, ty}]  el は position:absolute。left/top(px) が現在位置、tx/ty が正解位置。
     opt.snap(p) 吸着距離 / opt.onPlace(p) / opt.onWin()                           */
  PZ.snapDrag = (pieces, opt) => {
    let z = 10, placed = 0;
    const api = {
      count: () => placed,
      place(p, quiet) {
        if (p.placed) return;
        p.placed = true; p.el.style.transition = 'left .18s ease-out, top .18s ease-out';
        p.el.style.left = p.tx + 'px'; p.el.style.top = p.ty + 'px';
        p.el.classList.add('placed'); p.el.style.zIndex = 1; p.el.style.pointerEvents = 'none';
        if (!quiet) PZ.snd.ok();
        opt.onPlace && opt.onPlace(p);
        if (++placed === pieces.length) opt.onWin && setTimeout(opt.onWin, 250);
      },
    };
    pieces.forEach((p) => PZ.drag(p.el, {
      canStart: () => !p.placed,
      start() { p.x0 = parseFloat(p.el.style.left); p.y0 = parseFloat(p.el.style.top); p.el.style.zIndex = ++z; p.el.style.transition = 'none'; p.el.classList.add('drag'); PZ.snd.pick(); },
      move(el, dx, dy) { el.style.left = p.x0 + dx + 'px'; el.style.top = p.y0 + dy + 'px'; },
      end(el, dx, dy) {
        el.classList.remove('drag');
        const x = p.x0 + dx, y = p.y0 + dy;
        if (Math.hypot(x - p.tx, y - p.ty) <= opt.snap(p)) { api.place(p); return; }
        const w = el.offsetWidth, h = el.offsetHeight, m = 8;                       // 画面の外に出ないよう戻す
        const cx = Math.min(Math.max(x, m - w * .35), innerWidth - w * .65 - m), cy = Math.min(Math.max(y, m - h * .35), innerHeight - h * .65 - m);
        el.style.transition = 'left .15s, top .15s'; el.style.left = cx + 'px'; el.style.top = cy + 'px'; PZ.snd.drop();
      },
    }));
    return api;
  };
})();

<script>
/* store.js ― 端末の中だけに保存する（写真・シール・途中経過・設定）。サーバーには何も送らない。
   写真やシールは大きいので IndexedDB、小さな設定は localStorage。どちらも使えない環境では、その場かぎりのメモリに保存する */
(function () {
  'use strict';
  const mem = { photos: [], stickers: [], saves: [] };
  let db = null;
  const ready = new Promise((res) => {
    try {
      const rq = indexedDB.open('jigsaw-app', 1);
      rq.onupgradeneeded = () => { ['photos', 'stickers', 'saves'].forEach((n) => rq.result.createObjectStore(n, { keyPath: 'id' })); };
      rq.onsuccess = () => { db = rq.result; res(true); };
      rq.onerror = rq.onblocked = () => res(false);
    } catch (e) { res(false); }
  });

  const Store = (window.Store = {});
  Store.persistent = () => ready.then(() => !!db);
  const toMem = (store, obj) => { const a = mem[store], i = a.findIndex((x) => x.id === obj.id); if (i < 0) a.push(obj); else a[i] = obj; };
  Store.volatile = false;               // true なら、いま保存できず「このページを開いている間だけ」の保存になっている
  Store.put = async (store, obj) => {
    await ready;
    if (!db) { toMem(store, obj); Store.volatile = true; return 'mem'; }
    try {
      await new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(obj); t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error); });
      return 'db';
    } catch (e) { toMem(store, obj); Store.volatile = true; return 'mem'; }       // 容量不足・プライベートモードなど
  };
  Store.all = async (store) => {
    await ready;
    const m = mem[store].slice(); if (!db) return m;
    const d = await new Promise((res) => { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); });
    const ids = new Set(d.map((x) => x.id)); return d.concat(m.filter((x) => !ids.has(x.id)));
  };
  Store.get = async (store, id) => {
    await ready;
    const m = mem[store].find((x) => x.id === id); if (m || !db) return m || null;
    return new Promise((res) => { const r = db.transaction(store).objectStore(store).get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
  };
  Store.del = async (store, id) => {
    await ready; mem[store] = mem[store].filter((x) => x.id !== id);
    if (!db) return;
    return new Promise((res) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = () => res(); t.onerror = t.onabort = () => res(); });
  };
  Store.clear = async (store) => {
    await ready; mem[store] = [];
    if (!db) return;
    return new Promise((res) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).clear(); t.oncomplete = () => res(); t.onerror = t.onabort = () => res(); });
  };

  /* 画像の保存形式：Blob のままだと、iPhone では あとで中身が読めなくなることがある。
     そのため「バイト列(ArrayBuffer)＋種類」で保存し、使うときに Blob にもどす。 */
  Store.recBlob = (rec) => (rec.buf ? new Blob([rec.buf], { type: rec.type || 'image/jpeg' }) : rec.blob);
  Store.toBuf = (blob) => (blob.arrayBuffer ? blob.arrayBuffer() : new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(blob); }));
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }   // iOS に勝手に消されにくくする（お願いするだけ）

  /* 設定（小さいもの） */
  const KEY = 'jigsaw-app-settings';
  let cache = { sound: 1, src: { k: 'art', id: 'shoubousha' }, target: 100, level: 'normal', best: {} };
  try { Object.assign(cache, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { }
  Store.settings = cache;
  Store.saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) { } };
})();

</script>
<script>
/* engine.js ― ジグソー本体
   操作は「タップ＆タップ」: ピース置き場でピースをタップ → 盤面の置きたい場所をタップ。
   100枚をこえても遊べるよう、盤面は つまんで拡大／ゆびで移動できる。 */
(function () {
  'use strict';
  const CELL = 60;            // 盤面の1マス（ワールド座標）
  const TS = 0.88;            // ピース置き場での表示倍率
  const LEVELS = {
    easy:   { name: 'やさしい',         desc: 'うすい見本と、ヒントのひかり', ghost: 0.38, grid: true,  assist: true,  rot: false, snap: 0.8 },
    normal: { name: 'ふつう',           desc: 'うすい見本あり',               ghost: 0.14, grid: true,  assist: false, rot: false, snap: 0.55 },
    hard:   { name: 'むずかしい',       desc: 'すごく うすい見本だけ',         ghost: 0.09, grid: false, assist: false, rot: false, snap: 0.42 },
    expert: { name: 'ちょうむずかしい', desc: 'うすい見本＋ピースがまわっている', ghost: 0.09, grid: false, assist: false, rot: true, snap: 0.35 },
  };
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

  /* 複数の絵をタイル状にならべた「ぜんぶ」パズル */
  const COLLAGES = {
    animals:  { name: 'どうぶつ・しぜん ぜんぶ', say: 'みんな いるね', cols: 4, ids: () => PZ.art.filter((a) => a.cat === 'nature').map((a) => a.id) },
    vehicles: { name: 'のりもの ぜんぶ',         say: 'ぶーぶー',     cols: 4, ids: () => PZ.art.filter((a) => a.cat === 'vehicle').map((a) => a.id) },
  };

  /* ------------------------------------------------------------ 絵の読み込み */
  const Sources = {
    cache: {},
    key: (d) => (d.k === 'art' ? 'a:' + d.id : d.k === 'collage' ? 'c:' + (d.id || 'animals') : 'p:' + d.id),
    async load(desc) {
      const key = Sources.key(desc);
      if (Sources.cache[key]) return Sources.cache[key];
      let info;
      if (desc.k === 'art') {
        const a = PZ.art.find((x) => x.id === desc.id) || PZ.art[0];
        info = { img: await PZ.artImage(a), aspect: 1, name: a.name, say: a.say };
      } else if (desc.k === 'collage') {
        const def = COLLAGES[desc.id || 'animals'] || COLLAGES.animals, ids = def.ids(), cols = def.cols, rows = Math.ceil(ids.length / cols);
        const cv = document.createElement('canvas'); cv.width = cols * 400; cv.height = rows * 400;
        const x = cv.getContext('2d');
        for (let i = 0; i < ids.length; i++) x.drawImage(await PZ.artImage(PZ.art.find((a) => a.id === ids[i])), (i % cols) * 400, Math.floor(i / cols) * 400, 400, 400);
        info = { img: cv, aspect: cols / rows, name: def.name, say: def.say, tiles: { cols, rows, ids } };
      } else {
        const rec = await Store.get('photos', desc.id);
        if (!rec) throw new Error('photo-missing');
        let img; const blob = Store.recBlob(rec);
        try { img = await createImageBitmap(blob); }
        catch (e1) {
          try { const u = URL.createObjectURL(blob); img = await PZ.loadImage(u); }
          catch (e2) { throw Object.assign(new Error('photo-broken'), { name: 'PhotoBroken' }); }       // 保存された写真の中身が読めない
        }
        let aspect = clamp(rec.w / rec.h, 0.5, 2);
        if (rec.crop && rec.crop.w > 4 && rec.crop.h > 4) {                       // 「きりとり」で決めた範囲だけをパズルにする
          const k = Math.min(1, 1600 / Math.max(rec.crop.w, rec.crop.h)), cc = document.createElement('canvas');
          cc.width = Math.max(1, Math.round(rec.crop.w * k)); cc.height = Math.max(1, Math.round(rec.crop.h * k));
          cc.getContext('2d').drawImage(img, rec.crop.x, rec.crop.y, rec.crop.w, rec.crop.h, 0, 0, cc.width, cc.height);
          if (img.close) try { img.close(); } catch (e3) { }
          img = cc; aspect = clamp(cc.width / cc.height, 0.5, 2);
        }
        info = { img, aspect, name: rec.drawn ? 'わたしの え' : 'わたしの しゃしん', say: 'できたね' };
      }
      if (desc.k !== 'photo') Sources.cache[key] = info;
      return info;
    },
    /* 画像を W×H にぴったり「cover」で切り抜く */
    cover(img, W, H) {
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const c = document.createElement('canvas'); c.width = Math.round(W); c.height = Math.round(H);
      const s = Math.max(c.width / iw, c.height / ih), dw = iw * s, dh = ih * s;
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
      x.drawImage(img, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
      return c;
    },
  };
  /* 目標のピース数と絵の縦横比から、いちばん近い 行×列 を決める */
  function gridFor(target, aspect) {
    let best = null;
    for (let r = 2; r <= 40; r++) {
      const c = Math.max(2, Math.round(target / r)), n = r * c;
      const score = Math.abs(n - target) / target + Math.abs(Math.log((c / r) / aspect)) * 0.9;
      if (!best || score < best.score) best = { rows: r, cols: c, n, score };
    }
    return best;
  }


  /* ---------------------------------------------------- 「特徴のないピース」をなくす
     空・水・地面・道路などの「のっぺり」したマスを見つけて、絵に合う小さな絵柄（雲・鳥・泡・花など）を足す。
     どのピースにも見分ける手がかりがあるようにするため。同じ番号(seed)なら毎回同じ絵柄になる（再開しても同じ）。 */
  const PAL = {
    cloud: [['#ffffff']], bird: [['#334155']], balloon: [['#ff6b6b'], ['#ffd93d'], ['#a78bfa'], ['#34d399']],
    star: [['#ffd93d'], ['#fff3a0'], ['#ffb3d1']], heart: [['#ff6b8b'], ['#ff9fb5']],
    flower: [['#ff7eb6', '#ffd93d'], ['#ffffff', '#ffb703'], ['#a78bfa', '#fff3a0']],
    butterfly: [['#ff9f43', '#ffd39a'], ['#7c5cff', '#c4b5fd'], ['#f43f5e', '#fda4af']], ladybug: [['#ef4444']],
    bubble: [['#ffffff']], fish: [['#ff9f43'], ['#a78bfa'], ['#34d399'], ['#f472b6']], starfish: [['#ff6b8a'], ['#fb923c']],
    snow: [['#7dd3fc']], planet: [['#a78bfa', '#f5d0fe'], ['#fb923c', '#fde68a']], comet: [['#fff3a0']],
    crack: [['#000000']], pebble: [['#000000']], dots: [['#ffffff']],
  };
  const THEMES = {
    sky: ['cloud', 'bird', 'balloon', 'cloud', 'bird'], water: ['bubble', 'fish', 'starfish', 'bubble'], grass: ['flower', 'butterfly', 'ladybug', 'flower'],
    road: ['crack', 'pebble', 'crack', 'dots'], dirt: ['pebble', 'crack', 'pebble'], space: ['star', 'planet', 'comet', 'star'],
    snow: ['snow', 'star'], party: ['star', 'heart', 'balloon', 'dots'],
  };
  const star5 = (x, R, r) => { x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; x[i ? 'lineTo' : 'moveTo'](Math.cos(a) * q, Math.sin(a) * q); } x.closePath(); };
  const ell = (x, cx, cy, rx, ry, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, 6.3); x.fill(); };
  const MOTIF = {
    cloud(x, c) { x.fillStyle = c[0]; ell(x, 0, 0, 13, 6); ell(x, -7, -4, 8, 6); ell(x, 5, -6, 9, 7); },
    bird(x, c) { x.strokeStyle = c[0]; x.lineWidth = 2.6; x.lineCap = 'round'; x.beginPath(); x.moveTo(-10, 0); x.quadraticCurveTo(-5, -8, 0, 0); x.quadraticCurveTo(5, -8, 10, 0); x.stroke(); },
    balloon(x, c) { x.fillStyle = c[0]; ell(x, 0, -3, 7, 9); x.strokeStyle = 'rgba(60,60,60,.6)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(0, 6); x.quadraticCurveTo(-3, 11, 0, 15); x.stroke(); x.fillStyle = 'rgba(255,255,255,.5)'; ell(x, -2.5, -6, 1.8, 3, 0.4); },
    star(x, c) { x.fillStyle = c[0]; star5(x, 9, 4); x.fill(); x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1; x.stroke(); },
    heart(x, c) { x.fillStyle = c[0]; x.beginPath(); x.moveTo(0, 8); x.bezierCurveTo(-14, -2, -8, -12, 0, -5); x.bezierCurveTo(8, -12, 14, -2, 0, 8); x.fill(); },
    flower(x, c) { x.fillStyle = c[0]; for (let i = 0; i < 5; i++) { const a = i * 1.2566; ell(x, Math.cos(a) * 5.5, Math.sin(a) * 5.5, 4.2, 4.2); } x.fillStyle = c[1]; ell(x, 0, 0, 3.4, 3.4); },
    butterfly(x, c) { x.fillStyle = c[0]; ell(x, -6, -3, 6, 4.5, -0.4); ell(x, 6, -3, 6, 4.5, 0.4); x.fillStyle = c[1]; ell(x, -5, 4, 4, 3, 0.4); ell(x, 5, 4, 4, 3, -0.4); x.fillStyle = '#4a2c17'; ell(x, 0, 0, 1.4, 6); },
    ladybug(x, c) { x.fillStyle = '#222'; ell(x, 0, -6, 3.4, 3); x.fillStyle = c[0]; ell(x, 0, 1, 7, 7); x.fillStyle = '#222'; ell(x, -3, -1, 1.5, 1.5); ell(x, 3, 3, 1.5, 1.5); ell(x, -2, 5, 1.2, 1.2); x.fillRect(-0.4, -5, 0.8, 12); },
    bubble(x, c) { x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 1.8; x.beginPath(); x.arc(0, 0, 6, 0, 6.3); x.stroke(); x.fillStyle = 'rgba(255,255,255,.25)'; ell(x, 0, 0, 6, 6); x.fillStyle = 'rgba(255,255,255,.9)'; ell(x, -2, -2.5, 1.6, 1); x.strokeStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.arc(9, -7, 2.4, 0, 6.3); x.stroke(); },
    fish(x, c) { x.fillStyle = c[0]; ell(x, 0, 0, 9, 5.5); x.beginPath(); x.moveTo(-7, 0); x.lineTo(-14, -5); x.lineTo(-14, 5); x.closePath(); x.fill(); x.fillStyle = '#fff'; ell(x, 4, -1.4, 1.8, 1.8); x.fillStyle = '#222'; ell(x, 4.4, -1.4, 0.9, 0.9); },
    starfish(x, c) { x.fillStyle = c[0]; star5(x, 10, 4.4); x.fill(); x.fillStyle = 'rgba(255,255,255,.55)'; ell(x, 0, 0, 1.2, 1.2); },
    snow(x, c) { x.strokeStyle = c[0]; x.lineWidth = 1.8; x.lineCap = 'round'; for (let i = 0; i < 3; i++) { const a = i * 1.0472; x.beginPath(); x.moveTo(Math.cos(a) * 9, Math.sin(a) * 9); x.lineTo(-Math.cos(a) * 9, -Math.sin(a) * 9); x.stroke(); } },
    planet(x, c) { x.fillStyle = c[0]; ell(x, 0, 0, 6.5, 6.5); x.strokeStyle = c[1]; x.lineWidth = 1.8; x.beginPath(); x.ellipse(0, 0, 11, 3.2, -0.4, 0, 6.3); x.stroke(); },
    comet(x, c) { x.fillStyle = c[0]; ell(x, 4, 0, 4, 4); x.strokeStyle = 'rgba(255,243,160,.7)'; x.lineWidth = 2; x.lineCap = 'round'; x.beginPath(); x.moveTo(1, -1); x.lineTo(-12, -6); x.moveTo(1, 1); x.lineTo(-12, 5); x.stroke(); },
    crack(x) { x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = 1.8; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(-10, -4); x.lineTo(-3, 0); x.lineTo(-5, 5); x.moveTo(-3, 0); x.lineTo(5, -2); x.lineTo(10, 4); x.stroke(); },
    pebble(x) { x.fillStyle = 'rgba(0,0,0,.22)'; ell(x, -5, 2, 4.5, 3); ell(x, 4, -3, 3.4, 2.5); x.fillStyle = 'rgba(255,255,255,.18)'; ell(x, 6, 5, 2.6, 2); },
    dots(x, c) { x.fillStyle = c[0]; x.globalAlpha = 0.55; ell(x, -6, 2, 2.4, 2.4); ell(x, 2, -4, 2.8, 2.8); ell(x, 7, 5, 2, 2); x.globalAlpha = 1; },
  };
  const THEME_FORCE = { lion: { party: 'sky' }, tyrano: { party: 'sky' }, tricera: { party: 'sky' } };
  function themeOf(r, g, b, artId) {
    const t = themeOf0(r, g, b, artId); return (THEME_FORCE[artId] && THEME_FORCE[artId][t]) || t;
  }
  function themeOf0(r, g, b, artId) {

  function enrichSource(srcC, rows, cols, seed, info, desc) {
    let cx; try { cx = srcC.getContext('2d'); cx.getImageData(0, 0, 1, 1); } catch (e) { return; }
    const u = srcC.width / cols, uh = srcC.height / rows, rnd = PZ.rng((seed ^ 0x5bd1e995) | 0);
    const artAt = (fx, fy) => (desc.k === 'collage' ? info.tiles.ids[Math.floor(fy * info.tiles.rows) * info.tiles.cols + Math.floor(fx * info.tiles.cols)] : desc.id);
    const jobs = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const px = Math.floor(c * u), py = Math.floor(r * uh), w = Math.floor(u), h = Math.floor(uh);
      let d; try { d = cx.getImageData(px, py, w, h).data; } catch (e) { return; }
      const step = Math.max(1, Math.floor(w / 12)); let n = 0, sr = 0, sg = 0, sb = 0;
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) { const i = (y * w + x) * 4; sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; n++; }
      const mr = sr / n, mg = sg / n, mb = sb / n; let mad = 0;
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) { const i = (y * w + x) * 4; mad += (Math.abs(d[i] - mr) + Math.abs(d[i + 1] - mg) + Math.abs(d[i + 2] - mb)) / 3; }
      mad /= n;
      if (mad < 5.5) jobs.push({ r, c, theme: themeOf(mr, mg, mb, artAt((c + 0.5) / cols, (r + 0.5) / rows)) });
    }

      for (let k = 0; k < count; k++) {
        const name = list[(j.r * 7 + j.c * 3 + k * 2 + Math.floor(rnd() * 2)) % list.length], pals = PAL[name], col = pals[(j.r * 5 + j.c * 11 + k) % pals.length];
        const fx = k ? (rnd() < 0.5 ? 0.25 : 0.75) : 0.35 + rnd() * 0.3, fy = k ? (rnd() < 0.5 ? 0.25 : 0.75) : 0.35 + rnd() * 0.3;
        cx.save(); cx.translate((j.c + fx) * u, (j.r + fy) * uh); cx.rotate((rnd() - 0.5) * 0.5);

      }
    });
  }

  /* ---------------------------------------------------------------- 状態
     ピースは3つの場所のどれかにある:  'tray' ピース置き場 / 'table' 盤面の外のテーブル / 'board' 盤面（固定）
     テーブルのピースは「グループ」にまとまる。グループの位置は (ax, ay) = 盤面の左上(0,0)に相当する点。

  let G = null, ui = null;
  const cam = { x: 0, y: 0, s: 1 };
  const E = (window.Engine = { LEVELS, Sources, gridFor, CELL, on: {} });

  function refs() {
    if (ui) return ui;
    ui = {
      game: $('#game'), view: $('#view'), world: $('#world'), board: $('#board'), ring: $('#ring'), table: $('#table'),
      tray: $('#tray'), filters: $('#filters'), timer: $('#timer'), left: $('#left'),
      hand: $('#hand'), back: $('#back2tray'), ref: $('#ref'), refImg: $('#ref img'), peek: $('#peek'), peekImg: $('#peek img'), loading: $('#loading'), toast: $('#toast'),

  }
  const landscape = () => innerWidth > innerHeight;

  /* ------------------------------------------------------------- カメラ */
  function applyCam(anim) {

    ui.world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
    ui.world.style.setProperty('--inv', 1 / cam.s);               // 拡大しても枠線の太さが変わらないように
  }
  function viewSize() { const r = ui.view.getBoundingClientRect(); return { w: r.width, h: r.height, l: r.left, t: r.top }; }

  function setRefSize() {

    const w = a >= 1 ? box : box * a, h = a >= 1 ? box / a : box;
    Object.assign(ui.ref.querySelector('.pic').style, { width: w + 'px', height: h + 'px' });
  }
  function fitCam(anim) {

    let top = 0, left = 0, right = 0;
    if (landscape()) { left = hs + 16; right = Math.max(0, v.l + v.w - rr.left + 6); }

  /* 盤面の指操作：1本=移動 / 2本=拡大縮小 / ちょん=タップ */
  function bindView() {
    const v = ui.view, ptrs = new Map();

    const local = (e) => { const r = v.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

      if (e.target.closest('#hand,#back2tray,#peek,#ref,.zoom')) return;
      try { v.setPointerCapture(e.pointerId); } catch (_) { }

  /* ------------------------------------------------------------ 組み立て */
  async function start(o) {
    refs(); destroy();
    const L = LEVELS[o.level] || LEVELS.normal;
    ui.loading.classList.add('on'); ui.loading.querySelector('span').textContent = 'じゅんび中…';
    let info;
    try { info = await Sources.load(o.desc); }
    catch (e) { ui.loading.classList.remove('on'); throw e; }
    const grid = o.save ? { rows: o.save.rows, cols: o.save.cols } : gridFor(o.target, info.aspect);
    const rows = grid.rows, cols = grid.cols, n = rows * cols, W = cols * CELL, H = rows * CELL;
    const RES = Math.max(1, Math.min(2, 4096 / Math.max(W, H)));
    const pad = Math.ceil(CELL * 0.3), S = CELL + pad * 2, M = Math.round(Math.max(W, H) * 0.5);
    const seed = o.save ? o.save.seed : (Math.random() * 1e9) | 0;

    const rots = Array.from({ length: n }, () => (L.rot ? 1 + Math.floor(rnd() * 3) : 0));
    const srcC = Sources.cover(info.img, W * RES, H * RES);
    if (o.desc.k !== 'photo') enrichSource(srcC, rows, cols, seed, info, o.desc);      // 写真は そのまま（絵だけ、手がかりを足す）
    G = {
      desc: o.desc, key: Sources.key(o.desc), info, level: o.level, L, rows, cols, n, W, H, M, RES, pad, S, seed,
      srcC, edges, pieces: [], groups: [], gid: 0, z: 10, placed: 0, sel: null, misses: o.save ? o.save.misses || 0 : 0, elapsed: o.save ? o.save.elapsed || 0 : 0,
      started: !!(o.save && ((o.save.placed && o.save.placed.length) || (o.save.groups && o.save.groups.length))), over: false, filter: 'all',
      fit: 1, sTable: 0.2, sMin: 0.2, sMax: 3, order, opos: new Map(order.map((i, k) => [i, k])), timerId: 0, lastTick: 0, destroyed: false, cheerN: 0, joinN: 0, say: {},
    };
    // 盤面とテーブル
    const b = ui.board; b.width = Math.ceil(W * RES); b.height = Math.ceil(H * RES); b.style.width = W + 'px'; b.style.height = H + 'px';
    ui.world.style.width = W + 'px'; ui.world.style.height = H + 'px';
    Object.assign(ui.table.style, { left: -M + 'px', top: -M + 'px', width: W + 2 * M + 'px', height: H + 2 * M + 'px' });
    drawBoardBase();
    // 見本（右上の小さな見本と、タップで出る大きな見本）
    try {
      const refUrl = await PZ.canvasUrl(PZ.coverCanvas(srcC, Math.min(900, srcC.width), Math.min(900, srcC.width) * H / W), 'image/jpeg', 0.85);
      ui.peekImg.src = refUrl; ui.refImg.src = refUrl; ui.ref.style.display = '';
    } catch (err) { ui.ref.style.display = 'none'; }                // 画像の書き出しが禁止されている表示場所：見本だけあきらめて、パズルは続ける
    setRefSize();
    // ピース
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(S * RES);
      cv.style.width = cv.style.height = S * TS + 'px';
      const x = cv.getContext('2d'); x.scale(RES, RES); x.translate(pad, pad);
      const path = PZ.piecePath(r, c, rows, cols, CELL, CELL, edges, false);
      x.save(); x.clip(path); x.drawImage(srcC, -c * CELL, -r * CELL, W, H); x.restore();
      x.lineJoin = 'round'; x.strokeStyle = 'rgba(0,0,0,.30)'; x.lineWidth = 2.2; x.stroke(path);
      x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 1.1; x.stroke(path);
      G.pieces.push({ i, r, c, cv, rot: rots[i], deg: rots[i] * 90, state: 'tray', tp: null, g: null, edge: r === 0 || c === 0 || r === rows - 1 || c === cols - 1 });
      if (i % 25 === 24) { ui.loading.querySelector('span').textContent = `ピースを つくっています ${Math.round(i / n * 100)}%`; await nextFrame(); if (G.destroyed) return; }
    }
    // 保存分の復元：盤面 → テーブルのグループ → 残りはピース置き場へ

      (o.save.groups || []).forEach((sg) => { const ms = sg.m.filter((i) => G.pieces[i] && G.pieces[i].state === 'tray'); if (ms.length) newGroup(ms, sg.ax, sg.ay); });
    }

    // ふちガイド：やさしい・ふつうでは、まず まわりの「ふち」から。盤面のまわりを光らせ、置き場も「ふち」だけにする
    G.guide = (o.level === 'easy' || o.level === 'normal') && n >= 40 && !G.pieces.filter((p) => p.edge).every((p) => p.state === 'board');
    if (G.guide) {
      const el = document.createElement('div'); el.className = 'edgeguide'; el.style.width = W + 'px'; el.style.height = H + 'px'; ui.world.appendChild(el); G.guideEl = el;
      if (!o.save) setFilter('edge');
    }
    ui.game.classList.add('on'); ui.loading.classList.remove('on');
    await nextFrame(); fitCam(false);
    G.lastTick = performance.now(); G.timerId = setInterval(tick, 500);
    if (G.placed === G.n) win(true);
    else setTimeout(() => G && PZ.sayV(o.save ? 'つづきから はじめよう' : G.guide ? 'まずは、まわりの ふちの ピースから あつめよう' : (G.info.name === 'わたしの しゃしん' ? 'わたしの しゃしんの パズルだよ' : G.info.name + 'の パズルだよ。ピースを えらんでね'), true), 700);
  }
  function shuffleSeed(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function drawBoardBase() {
    const x = ui.board.getContext('2d'), { W, H, RES, L, rows, cols } = G;
    x.setTransform(RES, 0, 0, RES, 0, 0); x.clearRect(0, 0, W, H);
    x.fillStyle = '#fdf1d8'; x.fillRect(0, 0, W, H);
    if (L.ghost) { x.globalAlpha = L.ghost; x.drawImage(G.srcC, 0, 0, W, H); x.globalAlpha = 1; }
    if (L.grid) {                                                // 空のマスは、本物のピースの形の線で見せる
      x.strokeStyle = 'rgba(122,75,22,.34)'; x.lineWidth = 1.2; x.lineJoin = 'round';
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {

  }
  function drawPiece(p) {

    x.drawImage(p.cv, p.c * CELL - G.pad, p.r * CELL - G.pad, G.S, G.S);
  }
  /* ピース置き場の「もとの並び順」の位置に、ピースを戻す */
  function insertTp(p) {
    const tp = document.createElement('div'); tp.className = 'tp'; tp.dataset.i = p.i;
    tp.style.width = tp.style.height = G.S * TS + 8 + 'px';
    p.cv.style.transform = `rotate(${p.deg}deg)`; tp.appendChild(p.cv); p.tp = tp;
    const next = [...ui.tray.children].find((t) => G.opos.get(+t.dataset.i) > G.opos.get(p.i));
    ui.tray.insertBefore(tp, next || null);
  }
  function returnToTray(g) {                                                  // テーブルのかたまりを、ピース置き場へ戻す
    const ms = [...g.ms]; removeGroup(g);
    ms.forEach((i) => { const p = G.pieces[i]; p.g = null; p.state = 'tray'; insertTp(p); });
    G.sel = null; ui.hand.classList.remove('on'); ui.back.classList.remove('on'); ui.ring.classList.remove('on');
    PZ.snd.drop(); updateLabels(); setFilter(G.filter); persist();
  }
  function buildTp(p) {
    const tp = document.createElement('div'); tp.className = 'tp'; tp.dataset.i = p.i;
    tp.style.width = tp.style.height = G.S * TS + 8 + 'px';
    p.cv.style.transform = `rotate(${p.deg}deg)`; tp.appendChild(p.cv); p.tp = tp; ui.tray.appendChild(tp);
  }

  /* ----------------------------------------------------------- グループ（テーブルのかたまり） */
  function newGroup(ms, ax, ay) {
    const g = { id: ++G.gid, ms: new Set(ms), ax, ay, el: null, z: ++G.z, box: null };
    ms.forEach((i) => { const p = G.pieces[i]; p.g = g; p.state = 'table'; if (p.tp) { p.tp.remove(); p.tp = null; } });
    G.groups.push(g); compose(g); return g;
  }
  function removeGroup(g) { if (g.el) g.el.remove(); G.groups = G.groups.filter((x) => x !== g); }
  /* メンバーを1枚のcanvasに描く（かたまりが大きくても、画面の部品は1つ） */
  function compose(g) {
    let rmin = 1e9, rmax = -1, cmin = 1e9, cmax = -1;
    g.ms.forEach((i) => { const p = G.pieces[i]; rmin = Math.min(rmin, p.r); rmax = Math.max(rmax, p.r); cmin = Math.min(cmin, p.c); cmax = Math.max(cmax, p.c); });
    g.box = { rmin, rmax, cmin, cmax };
    const w = (cmax - cmin + 1) * CELL + 2 * G.pad, h = (rmax - rmin + 1) * CELL + 2 * G.pad;
    if (!g.el) { g.el = document.createElement('canvas'); g.el.className = 'grp'; ui.world.appendChild(g.el); }
    const cv = g.el; cv.width = Math.ceil(w * G.RES); cv.height = Math.ceil(h * G.RES); cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const x = cv.getContext('2d'); x.setTransform(G.RES, 0, 0, G.RES, 0, 0);
    g.ms.forEach((i) => { const p = G.pieces[i]; x.drawImage(p.cv, (p.c - cmin) * CELL, (p.r - rmin) * CELL, G.S, G.S); });
    placeGroupEl(g);
  }
  function placeGroupEl(g) {
    g.el.style.left = g.ax + g.box.cmin * CELL - G.pad + 'px'; g.el.style.top = g.ay + g.box.rmin * CELL - G.pad + 'px'; g.el.style.zIndex = g.z;
  }
  function hitGroup(wx, wy) {                                      // 指の下にある、いちばん上のグループとピース
    const gs = G.groups.slice().sort((a, b) => b.z - a.z);
    for (const g of gs) {
      const c = Math.floor((wx - g.ax) / CELL), r = Math.floor((wy - g.ay) / CELL);
      if (r < 0 || c < 0 || r >= G.rows || c >= G.cols) continue;
      const idx = r * G.cols + c; if (g.ms.has(idx)) return { g, idx };
    }
    return null;
  }
  function nbrs(i) {
    const p = G.pieces[i], out = [];
    if (p.r > 0) out.push(i - G.cols); if (p.r < G.rows - 1) out.push(i + G.cols); if (p.c > 0) out.push(i - 1); if (p.c < G.cols - 1) out.push(i + 1);
    return out;
  }
  const members = (U) => (U.from === 'tray' ? [U.p.i] : [...U.g.ms]);
  const touches = (U, idx) => members(U).some((i) => nbrs(i).includes(idx));     // 選んだものの誰かが、idx のピースと本当にとなりあっているか
  const upright = (U) => U.from !== 'tray' || U.p.rot % 4 === 0;

  /* ----------------------------------------------------- 選ぶ・置く・くっつける */
  function toast(msg, say) {
    if (say) PZ.sayV(say);
    ui.toast.textContent = msg; ui.toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => ui.toast.classList.remove('on'), 2200);
  }
  function startSelect() {
    if (!G.started) G.started = true;
    const s = Store.settings; if ((s.tipJoin || 0) < 3) { s.tipJoin = (s.tipJoin || 0) + 1; Store.saveSettings(); toast('つなげたい ピースを タップ。あいている ばしょを タップで おけるよ', 'ピースを タップして、あいている ばしょを タップしてね'); }
  }
  function selectTray(p) {
    if (!G || G.over || p.state !== 'tray') return;
    if (G.sel && G.sel.from === 'tray' && G.sel.p === p) { if (G.L.rot) { rotate(p); return; } deselect(); return; }
    deselect(); G.sel = { from: 'tray', p }; p.tp.classList.add('sel'); PZ.snd.pick();
    showHand(); startSelect();
    if (G.L.assist) pulseCell(p.r, p.c, 0);
  }
  function selectGroup(g) {
    deselect(); G.sel = { from: 'table', g }; g.el.classList.add('sel'); PZ.snd.pick();
    showHand(); startSelect(); ui.back.classList.add('on');
    if (G.L.assist) { const p = G.pieces[[...g.ms][0]]; pulseCell(p.r, p.c, 0); }
  }
  function deselect() {
    if (!G || !G.sel) return;
    const U = G.sel; if (U.from === 'tray') U.p.tp && U.p.tp.classList.remove('sel'); else U.g.el && U.g.el.classList.remove('sel');
    G.sel = null; ui.hand.classList.remove('on'); ui.back.classList.remove('on'); ui.ring.classList.remove('on');
  }
  function showHand() {
    const U = G.sel, h = ui.hand; h.innerHTML = ''; const c = document.createElement('canvas');
    const src = U.from === 'tray' ? U.p.cv : U.g.el;
    c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0);
    if (U.from === 'tray') c.style.transform = `rotate(${U.p.deg}deg)`;
    h.appendChild(c); h.classList.toggle('rot', U.from === 'tray' && G.L.rot); h.classList.add('on');
  }
  function rotate(p) {
    p.rot = (p.rot + 1) % 4; p.deg += 90; PZ.snd.pick();
    p.cv.style.transform = `rotate(${p.deg}deg)`;
    const hc = ui.hand.querySelector('canvas'); if (hc) hc.style.transform = `rotate(${p.deg}deg)`;
  }
  function pulseAt(wx, wy, ms) {
    const ring = ui.ring; ring.style.left = wx + 'px'; ring.style.top = wy + 'px'; ring.style.width = ring.style.height = CELL + 'px';
    ring.classList.remove('on'); void ring.offsetWidth; ring.classList.add('on');
    clearTimeout(pulseAt.t); if (ms) pulseAt.t = setTimeout(() => ring.classList.remove('on'), ms);
  }
  const pulseCell = (r, c, ms) => pulseAt(c * CELL, r * CELL, ms);
  function wobbleHand() { ui.hand.classList.remove('wob'); void ui.hand.offsetWidth; ui.hand.classList.add('wob'); }
  function miss() { G.misses++; PZ.snd.soft(); wobbleHand(); }
  const tol = () => G.L.snap * CELL;

  function onTap(x, y) {
    if (!G || G.over) return;
    const wx = (x - cam.x) / cam.s, wy = (y - cam.y) / cam.s, hit = hitGroup(wx, wy);
    const U = G.sel;
    if (!U) { if (hit) selectGroup(hit.g); return; }                         // 何も持っていない時：テーブルのかたまりを持ち上げる
    if (!upright(U)) { PZ.snd.soft(); wobbleHand(); toast('むきを そろえてね', 'ピースを タップして、むきを そろえてね'); return; }
    const inBoard = wx >= 0 && wy >= 0 && wx < G.W && wy < G.H;
    const bidx = inBoard ? Math.floor(wy / CELL) * G.cols + Math.floor(wx / CELL) : -1;
    if (inBoard && members(U).includes(bidx)) { toBoard(U); return; }        // 正しいマスをタップ：はまる（上にテーブルのかたまりが重なっていても）
    if (U.from === 'table' && hit && hit.g === U.g) { deselect(); return; }  // 自分をもう一度タップ：やめる
    if (hit) {                                                               // ほかのかたまりをタップ：その中のピースととなりあっていればくっつく
      if (touches(U, hit.idx)) attach(U, hit.g); else miss();
      return;
    }
    if (inBoard) {
      if (G.pieces[bidx].state === 'board' && touches(U, bidx)) toBoard(U);  // 置いてあるピースをタップ：となりなら、そこにはまる
      else miss();
      return;
    }
    if (wx >= -G.M && wy >= -G.M && wx < G.W + G.M && wy < G.H + G.M) putDown(U, wx, wy);   // テーブルの空いている所：仮置き
  }

  function popAt(src, left, top, w, h) {
    const pop = document.createElement('canvas'); pop.width = src.width; pop.height = src.height; pop.getContext('2d').drawImage(src, 0, 0);
    pop.className = 'pop'; Object.assign(pop.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
    ui.world.appendChild(pop); setTimeout(() => pop.remove(), 520);
  }
  /* 声のガイド：ほめる・おしえる（多すぎないよう、きりのいい所とときどきだけ） */
  const PRAISE = ['ぴったり！', 'いいね！', 'すごい！', 'じょうず！', 'できたね！'];
  function checkGuide() {                                                     // ふちが ぜんぶ そろったら、ガイドを消して「なか」へ
    if (!G || !G.guide || !G.guideEl) return;
    if (!G.pieces.filter((p) => p.edge).every((p) => p.state === 'board')) return;
    G.guideEl.classList.add('gone'); const el = G.guideEl; G.guideEl = null; setTimeout(() => el.remove(), 700);
    if (G.filter === 'edge') setFilter('mid');
  }
  function cheer(kind) {
    if (!G || G.over) return;
    const left = G.n - G.placed, edges = G.pieces.filter((p) => p.edge), edgeDone = edges.length && edges.every((p) => p.state === 'board');
    if (kind === 'board') {
      G.say = G.say || {};
      if (!G.say.half && G.placed * 2 >= G.n) { G.say.half = 1; return PZ.sayV('はんぶん できたよ！ すごいね', true); }
      if (!G.say.edge && edgeDone && G.n > 30) { G.say.edge = 1; return PZ.sayV('まわりの ふちが できたよ！', true); }
      if (!G.say.ten && left === 10) { G.say.ten = 1; return PZ.sayV('あと ちょっとだよ！ がんばれ', true); }
      if (++G.cheerN % 6 === 0) PZ.sayV(PZ.pick(PRAISE));
    } else if (kind === 'join') {
      if (++G.joinN === 1 || G.joinN % 8 === 0) PZ.sayV('くっついたね！');
    }
  }
  function finishMove() { deselect(); updateLabels(); persist(); }

  function toBoard(U) {                                                       // 盤面に固定する
    const ms = members(U);
    if (U.from === 'tray') { const p = U.p; popAt(p.cv, p.c * CELL - G.pad, p.r * CELL - G.pad, G.S, G.S); }
    else { const g = U.g; popAt(g.el, g.box.cmin * CELL - G.pad, g.box.rmin * CELL - G.pad, parseFloat(g.el.style.width), parseFloat(g.el.style.height)); removeGroup(g); }
    ms.forEach((i) => { const p = G.pieces[i]; if (p.tp) { p.tp.remove(); p.tp = null; } p.g = null; p.state = 'board'; G.placed++; drawPiece(p); });
    PZ.snd.ok(); finishMove();
    if (G.placed === G.n) win(false); else { checkGuide(); cheer('board'); }
  }
  function attach(U, T) {                                                     // となりあうかたまりにくっつく（位置はTにそろう）
    const ms = members(U);
    if (U.from === 'table') removeGroup(U.g);
    ms.forEach((i) => { const p = G.pieces[i]; if (p.tp) { p.tp.remove(); p.tp = null; } p.g = T; p.state = 'table'; T.ms.add(i); });
    T.z = ++G.z; compose(T);

  }
  function putDown(U, wx, wy) {                                               // テーブルに置く／動かす（近くのとなりに合えば、そのままくっつく）

    const set = new Set(members(U));
    for (const T of G.groups) {
      if (U.from === 'table' && T === U.g) continue;
      if (Math.abs(ax - T.ax) <= tol() && Math.abs(ay - T.ay) <= tol() && [...set].some((i) => nbrs(i).some((j) => T.ms.has(j)))) { attach(U, T); return; }
    }
    if (U.from === 'tray') newGroup([U.p.i], ax, ay);

    PZ.snd.drop(); finishMove();
  }

  /* ---------------------------------------------------- 絞りこみ・ヒント・表示 */
  function setFilter(f) {
    G.filter = f; ui.filters.querySelectorAll('button[data-f]').forEach((b) => b.classList.toggle('on', b.dataset.f === f));
    G.pieces.forEach((p) => { if (p.tp) p.tp.classList.toggle('hide', !(f === 'all' || (f === 'edge' ? p.edge : !p.edge))); });
    if (G.sel && G.sel.from === 'tray' && G.sel.p.tp.classList.contains('hide')) deselect();
  }
  function updateLabels() {
    const tray = G.pieces.filter((p) => p.state === 'tray'), onTable = G.pieces.filter((p) => p.state === 'table').length;
    ui.left.textContent = `あと ${G.n - G.placed}`;
    ui.filters.querySelector('[data-f="edge"]').textContent = `ふち ${tray.filter((p) => p.edge).length}`;
    ui.filters.querySelector('[data-f="mid"]').textContent = `なか ${tray.filter((p) => !p.edge).length}`;
    ui.filters.querySelector('[data-f="all"]').textContent = `ぜんぶ ${tray.length}`;

  }

      selectGroup(g); pulseCell(p.r, p.c, 4000); focusWorld((p.c + 0.5) * CELL, (p.r + 0.5) * CELL, true); return;
    }
    let cand = tray.filter((p) => nbrs(p.i).some((j) => st(j) === 'board')), mode = 'cell';
    if (!cand.length) { cand = tray.filter((p) => nbrs(p.i).some((j) => st(j) === 'table')); mode = 'table'; }
    if (!cand.length) { mode = 'cell'; cand = tray.filter((p) => (p.r === 0 || p.r === G.rows - 1) && (p.c === 0 || p.c === G.cols - 1)); }
    if (!cand.length) cand = tray;
    const p = PZ.pick(cand); PZ.sayV('ひかっている ピースを さがしてね', true);
    if (G.filter !== 'all') setFilter('all');
    selectTray(p);
    const t = ui.tray;
    if (landscape()) t.scrollTo({ top: p.tp.offsetTop - t.clientHeight / 2 + p.tp.offsetHeight / 2, behavior: 'smooth' });
    else t.scrollTo({ left: p.tp.offsetLeft - t.clientWidth / 2 + p.tp.offsetWidth / 2, behavior: 'smooth' });

    } else { pulseCell(p.r, p.c, 4000); focusWorld((p.c + 0.5) * CELL, (p.r + 0.5) * CELL, true); }
  }
  function setPeek(on) { ui.peek.classList.toggle('on', on); }

  /* ------------------------------------------------------------ 時間と保存 */
  function fmt(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function showTimer() { ui.timer.textContent = fmt(G.elapsed); }
  function tick() {
    if (!G) return; const now = performance.now(), dt = now - G.lastTick; G.lastTick = now;
    if (G.started && !G.over && !document.hidden && !document.querySelector('#sheet.on')) { const d = Math.min(dt, 2000); G.elapsed += d; showTimer(); E.on.tick && E.on.tick(d); }

  function persist(now) {

  /* ---------------------------------------------------------------- クリア */
  function win(restoredAlreadyDone) {

    Store.del('saves', E.saveId()).catch(() => { });

    const fin = document.createElement('canvas'); fin.width = G.srcC.width; fin.height = G.srcC.height; fin.getContext('2d').drawImage(G.srcC, 0, 0);
    fin.className = 'final'; fin.style.width = G.W + 'px'; fin.style.height = G.H + 'px'; ui.world.appendChild(fin);
    requestAnimationFrame(() => requestAnimationFrame(() => fin.classList.add('on')));
    fitCam(true);
    PZ.confetti(90); PZ.snd.win();
    const stats = { time: G.elapsed, misses: G.misses, n: G.n, level: G.level, key: G.key, desc: G.desc, name: G.info.name, say: G.info.say, srcC: G.srcC, W: G.W, H: G.H };
    setTimeout(() => G && PZ.sayV(G.info.say, true), 600);

  }

  function destroy() {
    if (!G) return;
    G.destroyed = true; clearInterval(G.timerId); clearTimeout(saveT);
    ui.tray.innerHTML = ''; ui.hand.classList.remove('on'); ui.ring.classList.remove('on'); ui.peek.classList.remove('on');
    ui.world.querySelectorAll('.final,.pop,.grp,.edgeguide').forEach((e) => e.remove());

  }

  /* ----------------------------------------------------------- ボタンの配線 */
  function init() {
    refs(); bindView();
    ui.tray.addEventListener('click', (e) => {
      const tp = e.target.closest('.tp'); if (!tp || !G) return; selectTray(G.pieces[+tp.dataset.i]);
    });

    ui.back.addEventListener('click', () => { if (G && G.sel && G.sel.from === 'table') returnToTray(G.sel.g); });

    $('#zOut').onclick = () => { const v = viewSize(); G && zoomAt(v.w / 2, v.h / 2, cam.s / 1.35, true); };
    $('#zFit').onclick = () => { if (!G) return; if (Math.abs(cam.s - G.fit) < G.fit * 0.04) fitTable(true); else fitCam(true); };   // 盤面ぜんたい → もう一度でテーブルぜんたい
    ui.ref.addEventListener('click', () => setPeek(!ui.peek.classList.contains('on')));      // 右上の見本：タップで大きく／もう一度で閉じる
    ui.peek.addEventListener('click', () => setPeek(false));
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (G) { setRefSize(); fitCam(false); } }, 200); });
  }

  E.active = () => !!G;
  E.debug = () => G;                                              // テスト用：内部状態を覗く
})();

<script>

(function () {

  const bestOf = () => (S.pid === 'p0' ? S.best : ((S.bestP = S.bestP || {})[S.pid] = S.bestP[S.pid] || {}));
  Engine.saveId = () => (S.pid === 'p0' ? 'current' : 'current:' + S.pid);

  /* ------------------------------------------------------- シール帳の「育ち」 */
  const TIERS = [
    { min: 0,  name: 'はじめての シールちょう', page: '#fff6e0', cover: '#ffb74d' },

    { min: 15, name: 'じょうず シールちょう',   page: '#eafbe6', cover: '#66bb6a' },

  const frameOf = (n) => (n >= 200 ? 3 : n >= 100 ? 2 : n >= 50 ? 1 : 0);

  /* ---------------------------------------------------------------- 共通 */
  const urls = {};
  function blobUrl(id, x) { return urls[id] || (urls[id] = URL.createObjectURL(x instanceof Blob ? x : Store.recBlob(x))); }
  /* 失敗の理由を、端末の中に最大8件 記録する（おとなの設定から見られる。原因調べ用） */
  function logErr(tag, err, extra) {

      const d = new Date(), t = `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;

      Store.saveSettings();
    } catch (e) { }
  }
  function flash(msg, ms) { const f = $('#flash'); f.textContent = msg; f.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.remove('on'), ms || 2200); }
  function loading(on, msg) { const l = $('#loading'); l.classList.toggle('on', on); if (msg) l.querySelector('span').textContent = msg; }
  function show(id) { document.querySelectorAll('.scr').forEach((s) => s.classList.toggle('on', s.id === id)); }
  function closeSheet() { $('#sheet').classList.remove('on'); $('#sheet').innerHTML = ''; }

  /* 写真を読みこむ：いくつかの方法を順番に試す（機種・ブラウザによって、使える方法がちがうため） */
  async function decodePhoto(file) {
    const errs = [];
    const tries = [
      ['img', async () => { const u = URL.createObjectURL(file); try { return await PZ.loadImage(u); } finally { setTimeout(() => URL.revokeObjectURL(u), 8000); } }],   // 向きは ブラウザが自動で反映
      ['bitmap+向き', () => createImageBitmap(file, { imageOrientation: 'from-image' })],
      ['reader', () => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => PZ.loadImage(fr.result).then(res, rej); fr.onerror = () => rej(fr.error || new Error('read')); fr.readAsDataURL(file); })],
      ['bitmap', () => createImageBitmap(file)],
    ];
    for (const [name, t] of tries) {
      try { const img = await t(); if ((img.naturalWidth || img.width) > 0) return img; errs.push(name + ':0px'); }
      catch (e) { errs.push(name + ':' + ((e && e.name) || 'err')); }
    }
    throw Object.assign(new Error(errs.join(',')), { stage: 'ひらけません（しゃしんの かたちが ちがうかも）' });
  }
  async function toJpegBlob(cv) {
    const b = await new Promise((r) => { try { cv.toBlob(r, 'image/jpeg', 0.88); } catch (e) { r(null); } });
    if (b) return b;
    const d = cv.toDataURL('image/jpeg', 0.88).split(','), bin = atob(d[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: 'image/jpeg' });
  }
  async function importPhotos(files) {
    closeSheet(); let ok = 0, vol = false; const bad = [];
    for (let i = 0; i < files.length; i++) {
      loading(true, `しゃしんを とりこみ中… ${i + 1}/${files.length}`);
      try {
        const img = await decodePhoto(files[i]), iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
        const sc = Math.min(1, 1600 / Math.max(iw, ih)), w = Math.max(1, Math.round(iw * sc)), h = Math.max(1, Math.round(ih * sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
        if (img.close) try { img.close(); } catch (e) { }
        let blob; try { blob = await toJpegBlob(cv); } catch (e) { throw Object.assign(e, { stage: 'ちいさくできません' }); }
        const rec = { id: 'p' + Date.now() + '_' + i, ts: Date.now() + i, w, h, type: 'image/jpeg', buf: await Store.toBuf(blob) };
        if ((await Store.put('photos', rec)) === 'mem') vol = true;
        S.src = { k: 'photo', id: rec.id }; ok++;
      } catch (err) {
        const f = files[i], info = `[${f.type || '?'} ${(f.size / 1048576).toFixed(1)}MB]`;

      }

    S.tab = 'photo'; Store.saveSettings(); loading(false);
    flash(!bad.length ? `しゃしんを ${ok}まい ついかしました${vol ? '（この たんまつでは ほぞんできないため、いまだけ つかえます）' : ''}`
      : ok ? `${ok}まい ついか、${bad.length}まいは ${bad[0]}` : `しゃしんを とりこめませんでした：${bad[0]}`, (!bad.length && !vol) ? 2200 : 7000);
