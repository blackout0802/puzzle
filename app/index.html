<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ジグソーシール帳</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head><body>
<main id="app">
  <!-- ホーム -->
  <section id="home" class="scr on"></section>

  <!-- ゲーム：上=ボタン / 中=盤面（拡大・移動できる） / 下=ピース置き場 -->
  <section id="game" class="scr">
    <header id="bar">
      <button id="gBack" aria-label="ホームへ">←</button>
      <span id="timer">0:00</span>
      <span id="left">のこり 0</span>
      <span class="sp"></span>
      <button id="gHint" class="wide">ヒント</button>
      <button id="zOut" aria-label="ちいさく">−</button>
      <button id="zIn" aria-label="おおきく">＋</button>
      <button id="zFit" aria-label="ぜんたい">⤢</button>
    </header>
    <div id="view">
      <div id="world"><div id="table"></div><canvas id="board"></canvas><div id="ring"></div></div>
      <div id="ref" role="button" aria-label="みほん"><img alt="みほん"></div>
      <div id="hand" aria-label="いま えらんでいるピース"></div>
      <div id="peek"><img alt="みほん（おおきく）"></div>
      <div id="toast"></div>
    </div>
    <aside id="trayWrap">
      <div id="filters"><button data-f="all">ぜんぶ</button><button data-f="edge">ふち</button><button data-f="mid">なか</button></div>
      <div id="tray"></div>
    </aside>
  </section>

  <!-- シール帳 -->
  <section id="book" class="scr"></section>

  <div id="sheet"></div>
  <div id="loading"><div class="spin"></div><span></span></div>
  <div id="flash"></div>
  <input type="file" id="file" accept="image/*" hidden>
</main>
<script src="js/common.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body></html>
