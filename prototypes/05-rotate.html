<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>05 くるくるパズル</title>
<link rel="stylesheet" href="common/common.css">
<style>
/* 05: ピースは最初から全部置いてある。タップでくるくる回して、絵を正しい向きにそろえる */
body{background:radial-gradient(circle at 50% 30%,#3a3f9a,#1d1f55 70%);color:#fff;display:flex;flex-direction:column;align-items:center}
#bar{height:64px;flex:none;width:100%;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 10px}
#bar button{min-width:46px;height:46px;border:0;border-radius:23px;background:rgba(255,255,255,.16);color:#fff;font-size:19px;font-weight:800}
#bar button.on{background:#ffd93d;color:#2a2a6a}
#stage{flex:1;display:grid;place-items:center;width:100%}
#grid{display:grid;gap:var(--gap);transition:gap .7s ease}
.cell{position:relative;border-radius:14px;overflow:hidden;background:#000;transition:border-radius .7s,box-shadow .3s}
.cell img{width:100%;height:100%;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.cell.ok{box-shadow:0 0 0 4px #5dff9d,0 0 22px #5dff9d}
.cell.ok:after{content:"★";position:absolute;right:6px;top:2px;color:#ffe14d;font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#grid.joined{--gap:0px !important}
#grid.joined .cell{border-radius:0;box-shadow:none}
#grid.joined .cell:after{display:none}
#next{position:fixed;left:50%;margin-left:-42px;bottom:6%;z-index:60;width:84px;height:84px;border-radius:50%;border:0;background:#ffd93d;color:#2a2a6a;font-size:38px;box-shadow:0 6px 0 #c9a200;display:none;animation:jump .6s infinite alternate}
@keyframes jump{to{transform:translateY(-12px)}}
</style></head><body>
<a class="home" href="index.html">⌂</a>
<div id="bar"><button data-n="4">4</button><button data-n="6">6</button><button data-n="9">9</button></div>
<div id="stage"><div id="grid"></div></div>
<button id="next">▶</button>
<script src="common/common.js"></script>
<script>
const {$, $$} = PZ;
const st = {n: 4, art: 0};
const grid = $('#grid');
let left = 0;

async function start() {
  $('#next').style.display = 'none'; grid.className = ''; grid.innerHTML = '';
  const [rows, cols] = PZ.grid(st.n, PZ.isPortrait()), n = rows * cols, gap = 8;
  const cell = PZ.fitCell(rows, cols, innerWidth - 24 - (cols - 1) * gap, innerHeight - 64 - 30 - (rows - 1) * gap);
  grid.style.setProperty('--gap', gap + 'px'); grid.style.gridTemplateColumns = `repeat(${cols},${cell}px)`;
  const src = await PZ.artCanvas(PZ.art[st.art], cols * cell, rows * cell);
  left = n;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const d = PZ.el('div', 'cell', grid); d.style.width = d.style.height = cell + 'px';
    const img = new Image(); img.draggable = false; img.src = PZ.pieceCanvas(src, r, c, rows, cols, cell, cell, null, true).toDataURL(); d.appendChild(img);
    let k = 1 + Math.floor(Math.random() * 3); d.dataset.k = k; img.style.transform = `rotate(${k * 90}deg)`;
    let deg = k * 90;
    d.onclick = () => {
      if (d.classList.contains('ok')) return;
      deg += 90; k = (k + 1) % 4; img.style.transform = `rotate(${deg}deg)`; PZ.snd.pick();
      if (k === 0) { setTimeout(() => { d.classList.add('ok'); PZ.snd.ok(); }, 200); if (--left === 0) setTimeout(finish, 650); }
    };
  }
}
function finish() { grid.classList.add('joined'); setTimeout(() => { PZ.win({say: PZ.art[st.art].say}); $('#next').style.display = 'block'; }, 500); }
$('#bar').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; st.n = +b.dataset.n; sync(); start(); };
$('#next').onclick = () => { st.art = (st.art + 1) % PZ.art.length; start(); };
function sync() { $$('#bar button').forEach((b) => b.classList.toggle('on', +b.dataset.n === st.n)); }
PZ.onLayoutChange(start); sync(); start();
</script></body></html>
