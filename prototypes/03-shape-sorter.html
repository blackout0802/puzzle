<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>03 かたちあわせ</title>
<link rel="stylesheet" href="common/common.css">
<style>
/* 03: 絵を切るのではなく「かたちはめ」。顔つきのかたちを同じ形の穴へ。いちばんやさしい */
body{background:#fff6d6}
#lid{position:absolute;left:50%;transform:translateX(-50%);top:64px;background:#f6c667;border-radius:26px;
  box-shadow:0 8px 0 #d99a2b,0 16px 24px rgba(0,0,0,.2);border:6px solid #fff0b8}
.hole{position:absolute}
.hole svg{width:100%;height:100%;overflow:visible}
.hole path,.hole circle,.hole rect,.hole polygon{fill:#8a5a1c;stroke:#6d4310;stroke-width:4;filter:none}
.sh{position:absolute;touch-action:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3))}
.sh svg{width:100%;height:100%;overflow:visible}
.sh.placed{filter:none;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.sh .face *{pointer-events:none}
.sh .smile{display:none}
.sh.placed .smile{display:block}.sh.placed .flat{display:none}
.sh .eye{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.sh .eye{transform-box:fill-box;transform-origin:center}
#bar{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:60;display:flex;gap:6px}
#bar button{min-width:46px;height:46px;border:0;border-radius:23px;background:#fff;color:#c47a00;font-size:19px;font-weight:800;box-shadow:0 3px 0 #e0b25a}
#bar button.on{background:#ff8a3c;color:#fff}
</style></head><body>
<a class="home" href="index.html">⌂</a>
<div id="bar"><button data-n="3">3</button><button data-n="4">4</button><button data-n="6">6</button><button id="again">↻</button></div>
<div id="lid"></div>
<script src="common/common.js"></script>
<script>
const {$, $$} = PZ;
const star = (() => { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 20 : 46; p.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (54 + r * Math.sin(a)).toFixed(1)); } return p.join(' '); })();
const SHAPES = [
  {id: 'circle', color: '#ff5a5f', svg: '<circle cx="50" cy="50" r="42"/>', fy: 50},
  {id: 'square', color: '#3b8bff', svg: '<rect x="10" y="10" width="80" height="80" rx="12"/>', fy: 50},
  {id: 'tri',    color: '#ffc61a', svg: '<polygon points="50,8 94,88 6,88" stroke-linejoin="round"/>', fy: 62},
  {id: 'star',   color: '#37c871', svg: `<polygon points="${star}" stroke-linejoin="round"/>`, fy: 54},
  {id: 'heart',  color: '#ff7eb6', svg: '<path d="M50 90 C8 60 4 30 26 17 C40 9 50 21 50 30 C50 21 60 9 74 17 C96 30 92 60 50 90Z"/>', fy: 48},
  {id: 'dia',    color: '#a56bff', svg: '<polygon points="50,6 94,50 50,94 6,50" stroke-linejoin="round"/>', fy: 50},
];
const st = {n: 4};
const lid = $('#lid');
let shapes = [], placed = 0;

function face(fy) {
  return `<g class="face"><ellipse class="eye" cx="36" cy="${fy - 4}" rx="5" ry="7" fill="#222"/><ellipse class="eye" cx="64" cy="${fy - 4}" rx="5" ry="7" fill="#222"/>
  <circle cx="30" cy="${fy + 8}" r="6" fill="#fff" opacity=".35"/><circle cx="70" cy="${fy + 8}" r="6" fill="#fff" opacity=".35"/>
  <path class="flat" d="M42 ${fy + 12} h16" stroke="#222" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path class="smile" d="M36 ${fy + 8} Q50 ${fy + 28} 64 ${fy + 8}" stroke="#222" stroke-width="4" stroke-linecap="round" fill="#fff"/></g>`;
}
function start() {
  $$('.sh').forEach((e) => e.remove()); lid.innerHTML = ''; placed = 0; shapes = [];
  const pick = PZ.shuffle(SHAPES).slice(0, st.n);
  const portrait = PZ.isPortrait();
  const cols = st.n === 3 ? 3 : (portrait ? 2 : (st.n === 4 ? 4 : 3)), rows = Math.ceil(st.n / cols);
  const S = Math.min(112, Math.floor((portrait ? innerWidth - 60 : innerWidth * .8) / cols) - 14, Math.floor((innerHeight - 64) * (portrait ? .5 : .45) / rows) - 14);
  const gap = 14, LW = cols * (S + gap) + gap, LH = rows * (S + gap) + gap;
  lid.style.width = LW + 'px'; lid.style.height = LH + 'px';
  const holes = PZ.shuffle(pick);
  holes.forEach((s, k) => {
    const h = PZ.el('div', 'hole', lid), r = Math.floor(k / cols), c = k % cols;
    const inRow = Math.min(cols, st.n - r * cols), off = (cols - inRow) * (S + gap) / 2;
    Object.assign(h.style, {width: S + 'px', height: S + 'px', left: gap + c * (S + gap) + off + 'px', top: gap + r * (S + gap) + 'px'});
    h.innerHTML = `<svg viewBox="0 0 100 100">${s.svg}</svg>`;
    s.hole = h;
  });
  // 下のゾーンに、シャッフルしてかたちを並べる
  const lidBottom = 64 + LH + 12 + 6, zoneH = innerHeight - lidBottom - 10;
  const per = Math.min(st.n, Math.max(2, Math.floor((innerWidth - 20) / (S + 12)))), trows = Math.ceil(st.n / per);
  const tileH = Math.min(S + 14, zoneH / trows);
  PZ.shuffle(pick).forEach((s, k) => {
    const el = PZ.el('div', 'sh', document.body), r = Math.floor(k / per), c = k % per, inRow = Math.min(per, st.n - r * per);
    const x0 = (innerWidth - inRow * (S + 12) + 12) / 2;
    s.hx = x0 + c * (S + 12); s.hy = lidBottom + 10 + r * tileH + (tileH - S) / 2;
    Object.assign(el.style, {width: S + 'px', height: S + 'px', left: s.hx + 'px', top: s.hy + 'px'});
    el.innerHTML = `<svg viewBox="0 0 100 100"><g fill="${s.color}" stroke="#fff" stroke-width="5">${s.svg}</g>${face(s.fy)}</svg>`;
    el.firstChild.querySelector('g').setAttribute('stroke-linejoin', 'round');
    s.el = el; s.S = S; shapes.push(s);
    let x0d, y0d;
    PZ.drag(el, {
      canStart: () => !s.placed,
      start() { x0d = parseFloat(el.style.left); y0d = parseFloat(el.style.top); el.style.transition = 'none'; el.style.zIndex = 20; el.style.transform = 'scale(1.1)'; PZ.snd.pick(); },
      move(_, dx, dy) { el.style.left = x0d + dx + 'px'; el.style.top = y0d + dy + 'px'; },
      end() {
        el.style.transform = '';
        const cx = parseFloat(el.style.left) + S / 2, cy = parseFloat(el.style.top) + S / 2;
        const hb = s.hole.getBoundingClientRect(), hx = hb.left + hb.width / 2, hy = hb.top + hb.height / 2;
        if (Math.hypot(cx - hx, cy - hy) < S * .65) {
          el.style.transition = 'left .15s, top .15s'; el.style.left = hb.left + 'px'; el.style.top = hb.top + 'px';
          s.placed = true; el.classList.add('placed'); el.style.zIndex = 5; PZ.snd.ok();
          if (++placed === st.n) PZ.win({say: 'かたち ぴったり'});
        } else {
          el.style.transition = 'left .35s cubic-bezier(.3,1.5,.5,1), top .35s cubic-bezier(.3,1.5,.5,1)';
          el.style.left = s.hx + 'px'; el.style.top = s.hy + 'px'; PZ.snd.soft();
        }
      },
    });
  });
}
$('#bar').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.n) { st.n = +b.dataset.n; sync(); }
  start();
};
function sync() { $$('#bar [data-n]').forEach((b) => b.classList.toggle('on', +b.dataset.n === st.n)); }
PZ.onLayoutChange(start); sync(); start();
</script></body></html>
